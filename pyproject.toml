[project]
name = "agent-gap-radar"
version = "0.1.0"
description = "Evidence-first gap radar for AI agent infrastructure: find where agents actually break, rank it, then hand the top gap to a build loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.scripts]
radar = "agent_gap_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gap_radar"]

[tool.pytest.ini_options]
addopts = "-q -n auto"
testpaths = ["tests"]
